name: Me contract

on:
  pull_request:
    paths:
      - "services/specs/me/**"
      - "services/specs/ai/**"
      - "tests/test_me_contract.py"
      - "tests/test_ai_contract.py"
      - ".github/workflows/me-contract.yml"
  push:
    branches: [main]
    paths:
      - "services/specs/me/**"
      - "services/specs/ai/**"
      - "tests/test_me_contract.py"
      - "tests/test_ai_contract.py"
      - ".github/workflows/me-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  me-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'unitysvc-core>=0.2.37,<0.3' jinja2 httpx
      - run: python -m unittest discover -s tests -v
